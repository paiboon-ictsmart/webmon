<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webmon ntfy Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; font-size: 1rem; }
    button { margin-top: 16px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    pre { background: #f3f3f3; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
    .ok { color: #1a7f37; } .err { color: #cf222e; }
  </style>
</head>
<body>
  <h1>Webmon – ntfy visitor notify test</h1>
  <p>
    Opening this page sends a notification to the ntfy topic below.
    Install the <a href="https://ntfy.sh/" target="_blank" rel="noopener">ntfy app</a>
    on your phone and subscribe to the same topic.
  </p>

  <label for="server">ntfy server</label>
  <input id="server" value="https://ntfy.sh">

  <label for="topic">Topic</label>
  <input id="topic" placeholder="e.g. webmon-ictsmart-xyz123">

  <button id="send">Send test notification</button>
  <p id="status"></p>

  <h3>Visitor info sent</h3>
  <pre id="info"></pre>

  <script>
    // Default topic. Pick something hard to guess – anyone who knows the topic
    // name can read and post to it on the public ntfy.sh server.
    // Can be overridden with ?topic=xxx&server=https://your.ntfy.server
    const DEFAULT_TOPIC = 'webmon-ictsmart-test';
    const DEFAULT_SERVER = 'https://ntfy.sh';

    const params = new URLSearchParams(location.search);
    const serverEl = document.getElementById('server');
    const topicEl = document.getElementById('topic');
    const statusEl = document.getElementById('status');
    const infoEl = document.getElementById('info');

    serverEl.value = params.get('server') || DEFAULT_SERVER;
    topicEl.value = params.get('topic') || DEFAULT_TOPIC;

    async function getPublicIp() {
      // Don't let a slow/blocked IP lookup delay the notification.
      try {
        const res = await fetch('https://api.ipify.org?format=json', {
          signal: AbortSignal.timeout(2000)
        });
        return (await res.json()).ip;
      } catch {
        return 'unknown';
      }
    }

    async function collectInfo() {
      return {
        page: location.href,
        referrer: document.referrer || '(direct)',
        ip: await getPublicIp(),
        userAgent: navigator.userAgent,
        language: navigator.language,
        screen: `${screen.width}x${screen.height}`,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        time: new Date().toLocaleString()
      };
    }

    async function notify(manual) {
      const server = serverEl.value.trim().replace(/\/+$/, '');
      const topic = topicEl.value.trim();
      if (!topic) {
        statusEl.className = 'err';
        statusEl.textContent = 'Please enter a topic.';
        return;
      }

      const info = await collectInfo();
      infoEl.textContent = JSON.stringify(info, null, 2);

      const message = [
        `Page: ${info.page}`,
        `From: ${info.referrer}`,
        `IP: ${info.ip}`,
        `Lang: ${info.language}  TZ: ${info.timezone}`,
        `Screen: ${info.screen}`,
        `UA: ${info.userAgent}`,
        `Time: ${info.time}`
      ].join('\n');

      // JSON publish to the server root. No custom headers / content-type,
      // so the browser sends a "simple" CORS request (no preflight).
      const payload = {
        topic,
        title: manual ? 'Webmon: manual test' : 'Webmon: new visitor',
        message,
        tags: ['eyes'],
        priority: 3,
        click: info.page
      };

      statusEl.className = '';
      statusEl.textContent = 'Sending...';
      try {
        const res = await fetch(server, { method: 'POST', body: JSON.stringify(payload) });
        if (!res.ok) throw new Error(`HTTP ${res.status} ${await res.text()}`);
        statusEl.className = 'ok';
        statusEl.textContent = `Sent to ${server}/${topic}`;
      } catch (e) {
        statusEl.className = 'err';
        statusEl.textContent = `Failed: ${e.message}`;
      }
    }

    document.getElementById('send').addEventListener('click', () => notify(true));

    // Notify immediately on every visit (including refreshes).
    notify(false);
  </script>
</body>
</html>
